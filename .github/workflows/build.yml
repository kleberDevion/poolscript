# Compila e testa a Jinga em cada sistema e guarda o pacote pronto.
#
# Roda em push na main e nas branches `porte-*`, em tag `v*` (que também
# publica o release com os pacotes) e sob pedido — é o que
# `jinga scripts/compila.pr mac|windows|todos` dispara com
# `gh workflow run build.yml -f alvo=<sistema>`.
name: build

on:
  push:
    branches: [main, 'porte-*']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      alvo:
        description: 'linux | mac | windows | todos'
        default: 'todos'

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.alvo == 'linux' || inputs.alvo == 'todos'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libsqlite3-dev libpq-dev \
            libmariadb-dev libmariadb-dev-compat unixodbc-dev libssl-dev libpng-dev \
            zlib1g-dev libgmp-dev libmongoc-dev libbson-dev \
            libpq5 libmariadb3 unixodbc libmongoc-1.0-0 bubblewrap
      - name: compila
        run: make pool testar
      - name: suite
        run: ./testar && JINGA_JIT=0 ./testar
      - name: empacota
        run: |
          (cd editor/vscode && npm install --omit=dev --no-audit --no-fund)
          ./build_bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: jinga-linux-x86_64
          path: dist/jinga-portable.tar.gz

  mac:
    if: github.event_name != 'workflow_dispatch' || inputs.alvo == 'mac' || inputs.alvo == 'todos'
    # Mac Intel (o do seu MacBook Pro 2019, i9): mesma arquitetura, mesmo JIT
    runs-on: macos-15-intel
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: dependencias (Homebrew)
        # O Homebrew não tem mais pacote pronto pro Mac Intel: o que não vem
        # na imagem do runner é compilado do fonte aqui.
        run: |
          brew install openssl@3 libpng gmp libpq mariadb-connector-c unixodbc \
            mongo-c-driver@1 coreutils
      - name: compila
        run: scripts/ci_anota.sh make pool testar
      - name: versao
        run: scripts/ci_anota.sh sh -c "./pool --version && ./pool -e 'import sys; post(sys.platform())'"
      - name: suite
        run: scripts/ci_anota.sh ./testar
      - name: suite sem o codigo de maquina
        if: always()
        run: JINGA_JIT=0 scripts/ci_anota.sh ./testar
      - name: portao inteiro
        run: |
          (cd editor/vscode && npm install --omit=dev --no-audit --no-fund)
          scripts/ci_anota.sh make check
      - name: empacota
        run: scripts/ci_anota.sh ./build_bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: jinga-macos-x86_64
          path: dist/jinga-macos-x86_64.tar.gz

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.alvo == 'windows' || inputs.alvo == 'todos'
    # Windows x64 nativo: o MSYS2 UCRT64 dá o gcc (o goto calculado do laço da
    # VM não existe no MSVC) e as bibliotecas; o jinga.exe sai estático
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make zip
          # python: os servidores falsos de SMTP/IMAP do teste/e2e/mail_local.pr
          # (sem ele o teste diz PULOU e o módulo mail fica sem teste no Windows)
          pacboy: >-
            gcc:p openssl:p libpng:p gmp:p sqlite3:p zlib:p
            postgresql:p libmariadbclient:p mongo-c-driver:p nodejs:p python:p
      - name: compila
        run: scripts/ci_anota.sh make pool testar
      - name: versao
        run: scripts/ci_anota.sh sh -c "./pool --version && ./pool -e 'import sys; post(sys.platform())'"
      - name: suite
        run: scripts/ci_anota.sh ./testar
      - name: suite sem o codigo de maquina
        if: always()
        run: JINGA_JIT=0 scripts/ci_anota.sh ./testar
      - name: portao inteiro
        run: |
          (cd editor/vscode && npm install --omit=dev --no-audit --no-fund)
          # O runner traz o MongoDB instalado, mas fora do PATH mínimo do
          # MSYS2: com a pasta dele no PATH, o teste/mongo_roda.pr sobe o
          # mongod e roda as checagens do driver aqui também.
          for d in "/c/Program Files/MongoDB/Server/"*/bin; do
            if [ -x "$d/mongod.exe" ]; then PATH="$PATH:$d"; fi
          done
          scripts/ci_anota.sh make check
      - name: empacota
        run: scripts/ci_anota.sh ./build_bundle.sh
      - name: instalador
        # o instalar.ps1 de verdade: instala do pacote numa pasta temporária,
        # roda o jinga.exe instalado e remove
        shell: pwsh
        run: |
          Expand-Archive dist/jinga-windows-x86_64.zip -DestinationPath "$env:RUNNER_TEMP/pac"
          & "$env:RUNNER_TEMP/pac/jinga-windows-x86_64/instalar.ps1" -Prefixo "$env:RUNNER_TEMP/jinga"
          & "$env:RUNNER_TEMP/jinga/bin/jinga.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:RUNNER_TEMP/pac/jinga-windows-x86_64/instalar.ps1" -Prefixo "$env:RUNNER_TEMP/jinga" -Remover
      - uses: actions/upload-artifact@v4
        with:
          name: jinga-windows-x86_64
          path: dist/jinga-windows-x86_64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, mac, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacotes
          merge-multiple: true
      - name: publica o release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" pacotes/* \
            --repo "${GITHUB_REPOSITORY}" --title "Jinga ${GITHUB_REF_NAME}" \
            --notes "Pacotes: Linux x86-64 (jinga-portable.tar.gz), macOS Intel (jinga-macos-x86_64.tar.gz), Windows x64 (jinga-windows-x86_64.zip)."
