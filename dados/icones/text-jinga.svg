<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    A logo da linguagem, CHAPADA.

    A logo e uma renderizacao 3D, com degrade dentro de cada faceta. A 16px
    no explorador de arquivos isso vira papa. Icone de linguagem que le em
    16px e poligono de cor solida — o do Ruby e assim.

    A geometria NAO foi inventada: cada poligono aqui e uma faceta medida na
    propria imagem (regiao conexa do quantizado, casco convexo simplificado),
    pintada com a cor media que a foto tem ali dentro. O que se perdeu foi o
    degrade; a forma e a dela.

    Os tons levam um piso de brilho: na foto a lateral direita e quase preta e
    sumia no tema escuro do editor.
  -->
  <polygon points="437,42 492,178 365,398 350,415 166,483 20,322 100,148 235,53 330,26" fill="#e8bd47"/>
  <polygon points="433,41 287,333 192,473 166,483 20,322 97,155 223,57 330,26" fill="#e8bd47"/>
