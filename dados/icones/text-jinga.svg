  <polygon points="284,182 285,337 229,403 219,403 102,262" fill="#9f6a04"/>
  <polygon points="437,42 491,165 447,250 348,169 389,77" fill="#a37818"/>
  <polygon points="95,264 139,390 138,444 71,370 32,310" fill="#ad7200"/>
