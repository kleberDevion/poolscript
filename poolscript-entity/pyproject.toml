[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.mypyc]
opt_level = "2"
strictness = "mypy_ini"

[project]
name = "poolscript"
version = "4.5.10"
description = "PoolScript - linguagem de programação híbrida (dinâmica/estática) com sintaxe Python+JS"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "PoolScript", email = "poolscript@proton.me"}]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Sem dependências obrigatórias — usa stdlib do Python
dependencies = []

[project.optional-dependencies]
dev    = ["pytest>=7"]
native = ["mypy>=1.0"]   # para compilação nativa com mypyc

[project.scripts]
pool = "poolscript.cli:fast_main"
psl = "poolscript.cli:fast_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
